# Netlify: builds the site as static files and serves them with full security headers.
# Connect this repo in Netlify (Add new site → Import from Git); these settings are picked up automatically.

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  STATIC_EXPORT = "true"
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# The CRM API behind /admin (netlify/functions/crm.ts). Needs CRM_PASSWORD, CRM_SESSION_SECRET
# and NETLIFY_API_TOKEN set under Site configuration → Environment variables (see README).
[functions]
  directory = "netlify/functions"

# Security headers on every page (mirrors next.config.ts).
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()"

# The private lead dashboard: never indexed, never cached.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# Videos, posters and hashed build files never change — cache for a year.
# So never overwrite a file in /media: give a changed file a new name (e.g. -v3) and update its reference,
# otherwise returning visitors keep the old version for up to a year.
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The share image is exported as an extensionless file (/opengraph-image), so tell browsers and
# social crawlers (Facebook, iMessage, LinkedIn) it is a PNG; without this some skip the preview.
[[headers]]
  for = "/opengraph-image"
  [headers.values]
    Content-Type = "image/png"
    Cache-Control = "public, max-age=86400"
